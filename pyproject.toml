[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpulse"
version = "0.3.0"
description = "Beautiful Git activity dashboard and analytics in your terminal"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Jonathan Laporte"},
]
keywords = ["git", "cli", "dashboard", "heatmap", "activity", "contributions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]

[project.scripts]
gitpulse = "gitpulse.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.5.0",
    "ty>=0.0.49",
]

[tool.setuptools.packages.find]
include = ["gitpulse*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001"]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["gitpulse/tests.py"]

[tool.ty]
src = ["gitpulse"]